# docker compose -f compose.yaml -f compose.dev.yaml up -d --build
services:
  web:
    ports:
      - "${APP_HTTP_PORT:-127.0.0.1:8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro

  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ./:/var/www/html
      - dev-vendor:/var/www/html/vendor
    command: ["sh", "-lc", "composer install --no-interaction --prefer-dist && exec php-fpm"]
volumes:
  dev-vendor:
