name: Bug report
description: Report a reproducible defect, with expected behavior and evidence.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Project SOT: https://github.com/users/fusumivietnam/projects/5"
  - type: textarea
    id: observed
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / test failures
      description: Never include tokens, passwords, or personal information.
