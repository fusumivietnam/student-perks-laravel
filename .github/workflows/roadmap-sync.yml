name: Roadmap sync
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  pull_request:
    types: [opened, edited, closed, reopened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: roadmap-sync-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Render from canonical GitHub metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-roadmap.cjs
      - name: Commit only when generated roadmap changed
        shell: bash
        run: |
          if git diff --quiet -- docs/ROADMAP.md; then
            echo "Roadmap already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "docs(roadmap): sync status from GitHub issues and PRs [skip ci]"
          git push origin HEAD:main
