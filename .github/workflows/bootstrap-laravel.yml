name: Bootstrap Laravel 13 (PostgreSQL 18)
on:
  push:
    branches: [main]
    paths:
      - '.github/bootstrap-lockfile-once.txt'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bootstrap-laravel
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_perks_test
          POSTGRES_USER: student_perks
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_perks -d student_perks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, pgsql, pdo_pgsql, bcmath, fileinfo
          tools: composer:v2
          coverage: none
      - name: Guard against repeated bootstrap
        shell: bash
        run: |
          test ! -f artisan || { echo 'Laravel already installed'; exit 1; }
          if git ls-remote --exit-code --heads origin bootstrap/laravel-foundation >/dev/null 2>&1; then
            echo "Bootstrap branch already exists; review that branch before retrying."
            exit 1
          fi
      - name: Generate Laravel 13, configure PostgreSQL
        shell: bash
        run: |
          composer create-project 'laravel/laravel:^13.0' "$RUNNER_TEMP/laravel-bootstrap" --prefer-dist --no-interaction --no-progress
          rsync -a --exclude='.git' --exclude='.github' --exclude='.env' --exclude='vendor' --exclude='node_modules' --exclude='README.md' "$RUNNER_TEMP/laravel-bootstrap/" ./
          python3 - <<'PY'
          from pathlib import Path
          import re
          env = Path('.env.example')
          content = env.read_text()
          content = re.sub(r'(?m)^DB_CONNECTION=.*$', 'DB_CONNECTION=pgsql', content)
          content = re.sub(r'(?m)^#?\s*DB_(HOST|PORT|DATABASE|USERNAME|PASSWORD)=.*$', '', content)
          content += '\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=student_perks\nDB_USERNAME=student_perks\nDB_PASSWORD=\n'
          env.write_text(content)
          phpunit = Path('phpunit.xml')
          text = phpunit.read_text()
          text = re.sub(r'(?m)^.*<env name="DB_CONNECTION"[^>]*\/>.*\n?', '', text)
          text = re.sub(r'(?m)^.*<env name="DB_DATABASE"[^>]*\/>.*\n?', '', text)
          phpunit.write_text(text)
          PY
      - name: Install project dependencies after copying skeleton
        shell: bash
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify PostgreSQL migrations and Laravel tests
        shell: bash
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: student_perks_test
          DB_USERNAME: student_perks
          DB_PASSWORD: ci_only_password
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan test
      - name: Generate deterministic npm lockfile for Docker build
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          test -f package-lock.json
      - name: Validate production Docker image
        shell: bash
        run: |
          docker build --tag student-perks:bootstrap .
      - name: Push isolated bootstrap branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bootstrap/laravel-foundation
          rm -f .github/project-bootstrap-once.txt .github/bootstrap-retry-once.txt .github/bootstrap-lockfile-once.txt
          git add -A
          git commit -m "chore: scaffold Laravel 13 with PostgreSQL 18"
          git push --set-upstream origin bootstrap/laravel-foundation
      - name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create --base main --head bootstrap/laravel-foundation \
            --title "Bootstrap Laravel 13 + PostgreSQL 18" \
            --body "Official Laravel 13 skeleton, PostgreSQL 18 migrations/tests and shared Docker production image build. No managed services or student verification."
