name: Laravel CI
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/project-setup-trigger.txt'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/project-setup-trigger.txt'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_perks_test
          POSTGRES_USER: student_perks
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_perks -d student_perks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate preview launcher syntax
        if: ${{ hashFiles('scripts/preview.sh') != '' }}
        run: |
          bash -n scripts/preview.sh
          bash -n scripts/preview-check.sh
          bash -n scripts/preview-watch.sh
          bash -n scripts/preview-image.sh
          bash -n tests/preview-image-selection.sh
          bash tests/preview-image-selection.sh
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
      - name: Require application source
        run: test -f artisan && test -f composer.lock && test -f package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, pgsql, pdo_pgsql, bcmath, fileinfo
          tools: composer:v2
          coverage: none
      - name: Get Composer cache location
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-
      - name: Validate Composer manifest and lock
        run: composer validate --strict
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Enforce PHP coding standards
        run: |
          if ! vendor/bin/pint --test; then
            # Print the exact formatter-generated patch; never write back to GitHub.
            vendor/bin/pint
            git diff --no-color -- app bootstrap config database routes tests
            exit 1
          fi
      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction
      - name: Test PostgreSQL migrations and application
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: student_perks_test
          DB_USERNAME: student_perks
          DB_PASSWORD: ci_only_password
          APP_ENV: testing
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
          php artisan test
      - name: Configure cached Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production Docker image (shared layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: student-perks:ci
          build-args: |
            PREVIEW_SOURCE_SHA=ci-test-revision
          cache-from: type=gha,scope=student-perks-app
          cache-to: type=gha,mode=max,scope=student-perks-app
      - name: Verify Docker image source revision
        run: test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' student-perks:ci)" = ci-test-revision
      - name: Smoke-test Docker image entrypoint and public release assets
        shell: bash
        run: |
          docker run --rm --entrypoint sh student-perks:ci -c 'test -f /usr/local/bin/app-entrypoint.sh && test -f /opt/app-public/index.php && test -f /opt/app-public/build/manifest.json && test -d /opt/app-public/css/filament && test -d /opt/app-public/js/filament'
          docker run --rm --entrypoint sh student-perks:ci -c 'php-fpm -t && php -m | grep -Ei "^Zend OPcache$"'
          docker run --rm --entrypoint sh student-perks:ci -c 'mkdir -p /var/www/html/public && sh /usr/local/bin/app-entrypoint.sh sh -c "test -f /var/www/html/public/index.php && test -f /var/www/html/public/build/manifest.json"'

      - name: Docker Compose HTTP and migration smoke test
        shell: bash
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_PASSWORD=ci_only_password
          export LOG_LEVEL=warning
          export APP_HTTP_PORT=127.0.0.1:18080
          docker tag student-perks:ci student-perks-app
          trap 'docker compose down --remove-orphans' EXIT
          docker compose config --quiet
          docker compose up -d --no-build
          docker compose exec -T app php artisan migrate --force
          # Runtime setting must reach PHP-FPM, not just exist in host .env.
          docker compose exec -T app php artisan config:show logging.channels.stderr | grep -i 'warning'
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:18080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/up >/dev/null
          # Local preview connects to loopback while preserving the browser Host.
          local_html="$(curl --fail --silent --show-error -H 'Host: localhost:8080' http://127.0.0.1:18080/)"
          grep -F 'href="http://localhost:8080/offers"' <<< "$local_html"
          grep -F 'action="http://localhost:8080/search"' <<< "$local_html"
          grep -E 'href="http://localhost:8080/build/assets/[^"]+\.css"' <<< "$local_html"
          grep -E 'src="http://localhost:8080/build/assets/[^"]+\.js"' <<< "$local_html"
          # Smoke the critical public routes and Filament login over real Nginx/FPM.
          for route in /offers /brands /articles /sitemap.xml '/search?q=nonexistent' /admin/login; do
            curl --fail --silent --show-error "http://127.0.0.1:18080$route" >/dev/null
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/offers/this-offer-does-not-exist)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/pages/this-page-does-not-exist)" = 404
          curl --fail --silent --show-error -I http://127.0.0.1:18080/ | grep -i '^x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/.env)" = 403 -o "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/.env)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/secret.php)" = 404
          docker compose restart app
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:18080/up >/dev/null
          # Verify CMS media persists in the shared storage volume and Nginx serves it.
          # Create the fixture as the PHP-FPM worker user, NOT root, to catch upload permission errors.
          docker compose exec -T -u www-data app sh -c 'mkdir -p storage/app/public/brands && printf "%s" "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/0HcAAAAASUVORK5CYII=" | base64 -d > storage/app/public/brands/ci-media-persistence.png'
          docker compose exec -T app sh -c 'test -L public/storage && test -f public/storage/brands/ci-media-persistence.png'
          media_sha="$(docker compose exec -T app sha256sum storage/app/public/brands/ci-media-persistence.png | cut -d ' ' -f1)"
          served_sha="$(curl --fail --silent --show-error http://127.0.0.1:18080/storage/brands/ci-media-persistence.png | sha256sum | cut -d ' ' -f1)"
          test "$media_sha" = "$served_sha"
          docker compose up -d --force-recreate --no-deps app
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:18080/up >/dev/null
          test "$media_sha" = "$(docker compose exec -T app sha256sum storage/app/public/brands/ci-media-persistence.png | cut -d ' ' -f1)"
          test "$media_sha" = "$(curl --fail --silent --show-error http://127.0.0.1:18080/storage/brands/ci-media-persistence.png | sha256sum | cut -d ' ' -f1)"
          docker compose exec -T -u www-data app rm storage/app/public/brands/ci-media-persistence.png
          # Exercise the actual Nginx -> PHP-FPM -> Laravel proxy chain.
          # Nginx forwards its original client REMOTE_ADDR to PHP-FPM.
          # Host curl reaches Nginx through the Compose bridge gateway,
          # not from the Nginx container IP; scope trust to that single peer.
          proxy_gateway_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' "$(docker compose ps -q web)")"
          test -n "$proxy_gateway_ip"
          export APP_ENV=production
          export TRUSTED_PROXIES="$proxy_gateway_ip"
          export TRUSTED_HOSTS=student.example.test
          export SESSION_SECURE_COOKIE=true
          export APP_URL=https://student.example.test
          docker compose up -d --no-build app
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused -H 'Host: student.example.test' http://127.0.0.1:18080/up >/dev/null
          proxy_html="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 \
            -H 'Host: student.example.test' -H 'X-Forwarded-Proto: https' \
            -H 'X-Forwarded-Port: 443' -H 'X-Forwarded-Host: injected.invalid' \
            http://127.0.0.1:18080/)"
          # Unknown Host values must be rejected, not reflected into absolute
          # SEO and admin URLs. The forwarded host is intentionally ignored.
          rejected_host_status="$(curl --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' \
            -H 'Host: injected.invalid' -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:18080/)"
          echo "Untrusted Host returned HTTP $rejected_host_status"
          if test "$rejected_host_status" != 400; then
            curl --silent --show-error --dump-header - -o /dev/null -H 'Host: injected.invalid' http://127.0.0.1:18080/ >&2
            echo 'FAIL: expected 400 for unapproved Host' >&2
            exit 1
          fi
          grep -F 'href="https://student.example.test/offers"' <<< "$proxy_html"
          grep -F 'action="https://student.example.test/search"' <<< "$proxy_html"
          grep -E 'href="https://student.example.test/build/assets/[^"]+\.css"' <<< "$proxy_html"
          grep -E 'src="https://student.example.test/build/assets/[^"]+\.js"' <<< "$proxy_html"
          if grep -F 'injected.invalid' <<< "$proxy_html"; then
            echo "FAIL: Untrusted forwarded Host leaked into public HTML" >&2
            exit 1
          fi
          proxy_admin_headers="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 --dump-header - -o /dev/null \
            -H 'Host: student.example.test' -H 'X-Forwarded-Proto: https' \
            -H 'X-Forwarded-Port: 443' -H 'X-Forwarded-Host: injected.invalid' \
            http://127.0.0.1:18080/admin)"
          grep -i '^location: https://student.example.test/admin/login' <<< "$proxy_admin_headers"
          # Ensure the production-like HTTPS admin session cookie is Secure/HttpOnly.
          # Verify through real Nginx -> PHP-FPM headers, not only Laravel unit config.
          proxy_login_headers="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 --dump-header - -o /dev/null \
            -H 'Host: student.example.test' -H 'X-Forwarded-Proto: https' \
            -H 'X-Forwarded-Port: 443' http://127.0.0.1:18080/admin/login)"
          grep -i '^set-cookie: .*; secure;' <<< "$proxy_login_headers"
          grep -i '^set-cookie: .*; httponly;' <<< "$proxy_login_headers"
          # The next smoke scenarios are local/Codespaces, without proxy trust.
          unset TRUSTED_PROXIES TRUSTED_HOSTS SESSION_SECURE_COOKIE

          # Verify Codespaces forwarded-origin HTML and real CSS without another CI job.
          export APP_ENV=local
          export APP_URL=https://ci-preview-8080.app.github.dev
          docker compose up -d --no-build app
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:18080/             | grep -F 'href="https://ci-preview-8080.app.github.dev/offers"'
          curl --fail --silent --show-error http://127.0.0.1:18080/             | grep -E 'href="https://ci-preview-8080.app.github.dev/build/assets/[^"]+\.css"'
          curl --fail --silent --show-error -I http://127.0.0.1:18080/build/manifest.json >/dev/null

          # Run real Chromium E2E against this disposable CI Compose stack only.
          # Revert the forwarded HTTPS test origin before driving browser links.
          export APP_URL=http://127.0.0.1:18080
          docker compose up -d --no-build app
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:18080/up >/dev/null
          # Explicit fictional fixtures; never seed the developer's Codespace or production.
          docker compose exec -T app php artisan db:seed --class=PreviewDemoSeeder --force
          docker compose exec -T -e E2E_TEST_STACK=1 app php artisan db:seed --class=BrowserCiAdminSeeder --force
          python3 -m venv /tmp/student-perks-browser-venv
          /tmp/student-perks-browser-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          /tmp/student-perks-browser-venv/bin/python -m playwright install --with-deps chromium firefox webkit
          # Chromium runs public+admin; Firefox/WebKit run public journeys only.
          # Aggregate all engines into one JSON/JUnit/Markdown report.
          # Capture failure screenshots while the isolated browser page is open.
          E2E_TEST_STACK=1 E2E_BASE_URL=http://127.0.0.1:18080 /tmp/student-perks-browser-venv/bin/python tests/browser/run_acceptance.py

          # Disaster-recovery rehearsal on this disposable CI stack ONLY.
          # Never target the source database/volume with pg_restore or extract over live media.
          rehearsal_dir="$(mktemp -d)"
          docker compose exec -T -u postgres db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$rehearsal_dir/database.dump"
          test -s "$rehearsal_dir/database.dump"
          sha256sum "$rehearsal_dir/database.dump"
          docker compose exec -T -u postgres db sh -c 'createdb -U "$POSTGRES_USER" restore_rehearsal_ci'
          docker compose exec -T -u postgres db sh -c 'pg_restore --exit-on-error --no-owner -U "$POSTGRES_USER" -d restore_rehearsal_ci' < "$rehearsal_dir/database.dump"
          source_offers="$(docker compose exec -T -u postgres db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT COUNT(*) FROM offers"')"
          restored_offers="$(docker compose exec -T -u postgres db sh -c 'psql -U "$POSTGRES_USER" -d restore_rehearsal_ci -Atqc "SELECT COUNT(*) FROM offers"')"
          source_users="$(docker compose exec -T -u postgres db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT COUNT(*) FROM users"')"
          restored_users="$(docker compose exec -T -u postgres db sh -c 'psql -U "$POSTGRES_USER" -d restore_rehearsal_ci -Atqc "SELECT COUNT(*) FROM users"')"
          test "$source_offers" -gt 0
          test "$source_users" -gt 0
          test "$source_offers" = "$restored_offers"
          test "$source_users" = "$restored_users"
          echo "PASS: isolated database restore matches $source_offers offers and $source_users users."

          # Exercise the same media archive boundary documented for production.
          docker compose exec -T -u www-data app sh -c 'mkdir -p storage/app/public/brands && printf "restore-proof-ci" > storage/app/public/brands/restore-proof-ci.txt'
          original_media_sha="$(docker compose exec -T app sha256sum storage/app/public/brands/restore-proof-ci.txt | cut -d ' ' -f1)"
          docker compose exec -T app tar -czf - -C /var/www/html/storage app/public > "$rehearsal_dir/media.tar.gz"
          test -s "$rehearsal_dir/media.tar.gz"
          tar -tzf "$rehearsal_dir/media.tar.gz" | grep -Fx 'app/public/brands/restore-proof-ci.txt'
          sha256sum "$rehearsal_dir/media.tar.gz"
          docker compose exec -T app sh -c 'mkdir -p /tmp/restore-rehearsal-ci && tar -xzf - -C /tmp/restore-rehearsal-ci' < "$rehearsal_dir/media.tar.gz"
          restored_media_sha="$(docker compose exec -T app sha256sum /tmp/restore-rehearsal-ci/app/public/brands/restore-proof-ci.txt | cut -d ' ' -f1)"
          test "$original_media_sha" = "$restored_media_sha"
          docker compose exec -T -u www-data app rm storage/app/public/brands/restore-proof-ci.txt
          docker compose exec -T app rm -rf /tmp/restore-rehearsal-ci
          docker compose exec -T -u postgres db sh -c 'dropdb -U "$POSTGRES_USER" restore_rehearsal_ci'
          rm -rf "$rehearsal_dir"
          echo "PASS: isolated database and media backup/restore rehearsal."

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance-${{ github.run_id }}
          path: artifacts/acceptance/
          if-no-files-found: ignore
          retention-days: 14
