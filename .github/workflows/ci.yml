name: Laravel CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_perks_test
          POSTGRES_USER: student_perks
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_perks -d student_perks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect scaffold
        id: scaffold
        run: echo "present=$([ -f artisan ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.scaffold.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, pgsql, pdo_pgsql, bcmath, fileinfo
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies
        if: steps.scaffold.outputs.present == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Test PostgreSQL migrations and application
        if: steps.scaffold.outputs.present == 'true'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: student_perks_test
          DB_USERNAME: student_perks
          DB_PASSWORD: ci_only_password
          APP_ENV: testing
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan test
      - name: Build production Docker image
        if: steps.scaffold.outputs.present == 'true'
        run: docker build --tag student-perks:ci .
