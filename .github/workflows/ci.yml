name: Laravel CI
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/project-setup-trigger.txt'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/project-setup-trigger.txt'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_perks_test
          POSTGRES_USER: student_perks
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_perks -d student_perks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate preview launcher syntax
        if: ${{ hashFiles('scripts/preview.sh') != '' }}
        run: |
          bash -n scripts/preview.sh
          bash -n scripts/preview-check.sh
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
      - name: Detect scaffold
        id: scaffold
        run: echo "present=$([ -f artisan ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.scaffold.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, pgsql, pdo_pgsql, bcmath, fileinfo
          tools: composer:v2
          coverage: none
      - name: Get Composer cache location
        if: steps.scaffold.outputs.present == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        if: steps.scaffold.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-
      - name: Install PHP dependencies
        if: steps.scaffold.outputs.present == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Test PostgreSQL migrations and application
        if: steps.scaffold.outputs.present == 'true'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: student_perks_test
          DB_USERNAME: student_perks
          DB_PASSWORD: ci_only_password
          APP_ENV: testing
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan test
      - name: Build production Docker image
        if: steps.scaffold.outputs.present == 'true'
        run: docker build --tag student-perks:ci .
      - name: Smoke-test Docker image entrypoint and public release assets
        if: steps.scaffold.outputs.present == 'true'
        shell: bash
        run: |
          docker run --rm --entrypoint sh student-perks:ci -c 'test -f /usr/local/bin/app-entrypoint.sh && test -f /opt/app-public/index.php && test -f /opt/app-public/build/manifest.json && test -d /opt/app-public/css/filament && test -d /opt/app-public/js/filament'
          docker run --rm --entrypoint sh student-perks:ci -c 'php-fpm -t && php -m | grep -Ei "^Zend OPcache$"'
          docker run --rm --entrypoint sh student-perks:ci -c 'mkdir -p /var/www/html/public && sh /usr/local/bin/app-entrypoint.sh sh -c "test -f /var/www/html/public/index.php && test -f /var/www/html/public/build/manifest.json"'

      - name: Docker Compose HTTP and migration smoke test
        if: steps.scaffold.outputs.present == 'true'
        shell: bash
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_PASSWORD=ci_only_password
          export APP_HTTP_PORT=127.0.0.1:18080
          docker tag student-perks:ci student-perks-app
          trap 'docker compose down --remove-orphans' EXIT
          docker compose config --quiet
          docker compose up -d --no-build
          docker compose exec -T app php artisan migrate --force
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:18080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/up >/dev/null
          curl --fail --silent --show-error -I http://127.0.0.1:18080/ | grep -i '^x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/.env)" = 403 -o "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/.env)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/secret.php)" = 404
          docker compose restart app
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:18080/up >/dev/null
          # Verify Codespaces forwarded-origin HTML and real CSS without another CI job.
          export APP_ENV=local
          export APP_URL=https://ci-preview-8080.app.github.dev
          docker compose up -d --no-build app
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:18080/             | grep -F 'href="https://ci-preview-8080.app.github.dev/offers"'
          curl --fail --silent --show-error http://127.0.0.1:18080/             | grep -E 'href="https://ci-preview-8080.app.github.dev/build/assets/[^"]+\.css"'
          curl --fail --silent --show-error -I http://127.0.0.1:18080/build/manifest.json >/dev/null
