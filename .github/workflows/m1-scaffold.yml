name: M1 Filament generation (one time)
on:
  push:
    branches: [feature/m1-filament-cms]
    paths:
      - .github/m1-once.txt

permissions:
  contents: write

concurrency:
  group: m1-filament-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_perks_test
          POSTGRES_USER: student_perks
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_perks -d student_perks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: student_perks_test
      DB_USERNAME: student_perks
      DB_PASSWORD: ci_only_password
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-filament-cms
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, intl, zip, gd, pgsql, pdo_pgsql, bcmath, fileinfo
          tools: composer:v2
          coverage: none
      - name: Install Filament using official generator
        run: |
          composer require 'filament/filament:^5.0' -W --no-interaction --no-progress
          php artisan filament:install --panels --no-interaction
          php artisan migrate --force
          php artisan make:filament-resource Brand --generate --simple --no-interaction
          php artisan make:filament-resource Category --generate --simple --no-interaction
          php artisan make:filament-resource Offer --generate --no-interaction
          cp .env.example .env
          php artisan key:generate
          php artisan test
          php artisan route:list --path=admin
      - name: Save generated code and retire one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/m1-scaffold.yml .github/m1-once.txt
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(m1): install Filament 5 and generate admin CRUD from schema"
          git push origin HEAD:feature/m1-filament-cms
