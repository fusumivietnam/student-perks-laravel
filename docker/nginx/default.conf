server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Docker service IPs can change on app container recreation.
    # Resolve the FastCGI service at request time, with a short DNS TTL.
    resolver 127.0.0.11 valid=1s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt {
        access_log off;
        rewrite ^ /index.php last;
    }

    # Only the Laravel front controller can execute PHP.
    location = /index.php {
        internal;
        include fastcgi_params;
        set $php_fpm_backend app:9000;
        fastcgi_pass $php_fpm_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    client_max_body_size 12m;
}
